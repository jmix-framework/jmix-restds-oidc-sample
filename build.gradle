ext.jmixCompositeProjectRoot = true

def projectNames = ['client-app', 'service-app', 'backend-app', 'frontend-app']

tasks.register('clean') {
    projectNames.each {
        dependsOn gradle.includedBuild(it).task(':clean')
    }
}

tasks.register('test') {
    projectNames.each {
        dependsOn gradle.includedBuild(it).task(':test')
    }
}